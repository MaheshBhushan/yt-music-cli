[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytm"
version = "0.11.1"
description = "YouTube Music in the terminal: a Textual TUI and CLI on top of mpv"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Mahesh Koduri" }]
requires-python = ">=3.11"
keywords = ["youtube-music", "music", "player", "tui", "cli", "mpv", "textual"]
classifiers = [
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "ytmusicapi>=1.12.2,<1.13",
    "requests",
    "google-auth-oauthlib>=1.2.2",
    "yt-dlp",
    "bgutil-ytdlp-pot-provider",
    "textual",
    # 0.12.0 is the last release supporting Python 3.11; 0.13+ replaced
    # Pillow's deprecated Image.getdata() (the source of the cover-art
    # deprecation warning) but requires Python >= 3.12.
    "textual-image",
    "platformdirs>=4",
    "pycaw>=20251023; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest"]
# Isolated `ytm login --method playwright` needs Playwright; the browser binary it
# drives is installed separately (`ytm login --install-browser`).
login = ["playwright>=1.40"]

[project.scripts]
ytm = "ytm.cli:main"

[project.urls]
Homepage = "https://github.com/MaheshBhushan/yt-music-cli"
Source = "https://github.com/MaheshBhushan/yt-music-cli"
Issues = "https://github.com/MaheshBhushan/yt-music-cli/issues"

[tool.setuptools.packages.find]
include = ["ytm*"]

[tool.setuptools.package-data]
ytm = ["mpv/*.lua", "tui/*.tcss", "oauth_default_client.json", "windows_update.ps1"]
